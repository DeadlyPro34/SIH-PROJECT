<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Registration</title>
  <link rel="stylesheet" href="module.css">

  <script>
    // Show SPOC form only if College form is valid
    function showSpocForm() {
      const form = document.getElementById("collegeForm");

      if (form.checkValidity()) {
        document.getElementById("collegeForm").style.display = "none";
        document.getElementById("spocForm").style.display = "block";
      } else {
        form.reportValidity();
      }
    }

    // Go back to College form
    function showCollegeForm() {
      document.getElementById("spocForm").style.display = "none";
      document.getElementById("collegeForm").style.display = "block";
    }

    // Handle SPOC form submission
    function handleSubmit(event) {
      event.preventDefault(); // stop page reload
      alert("✅ Registration submitted successfully!");

      // You can later send data to server using fetch() here
      // Example:
      // fetch('/register', { method: 'POST', body: new FormData(event.target) });

      // Optionally clear forms
      document.getElementById("collegeForm").reset();
      document.getElementById("spocForm").reset();

      // Optionally redirect to thank-you page:
      // window.location.href = "thankyou.html";
    }
  </script>
</head>

<body>
  <div class="form-container">
    <h1>College / Institute / University</h1>

    <!-- College Form -->
    <form id="collegeForm" novalidate>
      <label>College name :</label>
      <input type="text" name="college_name" required><br>

      <label>Contact :</label>
      <input type="tel" name="contact" required><br>

      <label>Address :</label>
      <input type="text" name="address" required><br>

      <label>AISHE code :</label>
      <input type="text" name="aishe_code" required><br>

      <button type="button" class="next-btn" onclick="showSpocForm()">Next</button>
    </form>

    <!-- SPOC Form -->
    <form id="spocForm" style="display:none;" onsubmit="handleSubmit(event)">
      <h1>SPOC Registration</h1>

      <label>Name :</label>
      <input type="text" name="name" required><br>

      <label>Phone number :</label>
      <input type="tel" name="phone" required><br>

      <label>Email :</label>
      <input type="email" name="email" required><br>

      <label>Employee ID :</label>
      <input type="text" name="employee_id" required><br>

      <label>ID Card (Photo*) :</label>
      <input type="file" accept="image/*" required><br>

      <label>Endorsement letter (PDF*) :</label>
      <input type="file" accept="application/pdf" required><br>

      <div class="button-group">
        <button type="button" class="back-btn" onclick="showCollegeForm()">Back</button>
        <button type="submit" class="register-btn">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
