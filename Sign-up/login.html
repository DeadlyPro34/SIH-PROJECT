<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlaceMint Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h1 class="logo">PlaceMint</h1>
      <h2 class="title">Login</h2>

      <form>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit" class="login-btn">Login</button>

        <div class="reset-row">
          <p>Forgot password?</p>
          <button type="button" class="reset-btn">Reset</button>
        </div>

        <div class="divider">
          <hr><span>Or</span><hr>
        </div>

        <button type="button" class="google-btn">
          <img src="logo_google_g_icon.png" alt="Google logo">
          Login with Google
        </button>

        <div class="signup">
          <p>Don't have an account?</p>
          <a href="../Register/login_page/signup.html">SignUp</a>
        </div>
      </form>
    </div>

    <div class="image-box">
      <img src="image_illustration.jpg" alt="Handshake illustration">
    </div>
  </div>
</body>
</html>
